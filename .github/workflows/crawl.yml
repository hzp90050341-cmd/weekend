# 每天台北時間 05:30 跑爬蟲，更新 crawled.json 並推送；Netlify 會自動重新部署。
name: crawl
on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = 台北 05:30
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/crawl.py --out /tmp/crawl --prev crawled.json --overrides overrides.json
      - run: cp /tmp/crawl/crawled.json crawled.json
      - run: |
          git config user.name "weekend-tw-bot"
          git config user.email "weekend-tw-bot@users.noreply.github.com"
          git add crawled.json
          git diff --cached --quiet || git commit -m "每日爬蟲更新 $(TZ=Asia/Taipei date +%F)"
          git push
