# Claude 的每日排程只能推送到 claude/ 開頭的分支。
# 它推送後，這個流程把人工查證的活動（events.json）與爬蟲修正檔（overrides.json）複製到 main，Netlify 就會重新部署。
name: sync
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-main
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 從 Claude 的分支取出資料檔
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          for f in events.json overrides.json; do
            git checkout "origin/${GITHUB_REF_NAME}" -- "$f" 2>/dev/null || echo "略過 $f（分支上沒有）"
          done
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('events.json', 'overrides.json')]"
      - name: 推送到 main
        run: |
          git config user.name "weekend-tw-bot"
          git config user.email "weekend-tw-bot@users.noreply.github.com"
          git add events.json overrides.json
          git diff --cached --quiet && { echo "資料沒有變動"; exit 0; }
          git commit -m "同步 Claude 查證資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
